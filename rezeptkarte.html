<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f7ee"><title>Rezeptkarte · Mein Kochbuch</title>
<style>
:root{--dark:#2c4936;--sage:#758c70;--paper:#fcfaf2;--pale:#eef2e7;--line:#cbd5c5;--ink:#303d33;--gold:#d2bd7e}
*{box-sizing:border-box}
body{margin:0;background:#e8ebe3;font:15px/1.43 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button,a{font:inherit}
.toolbar{max-width:1160px;padding:14px 16px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:13px}
.toolbar a{color:var(--dark);font-weight:700;text-decoration:none}
.toolbar .hint{color:#63705f;font-size:12px;flex:1}
.toolbar button{padding:10px 15px;border:0;border-radius:10px;background:var(--dark);color:#fff;font-weight:650;cursor:pointer}
.recipe{max-width:1160px;margin:0 auto 24px;padding:16px;background:var(--paper);border:1px solid #ced1c4;box-shadow:0 10px 32px #2137281c}
.frame{border:1px solid #bdcbb7;border-radius:17px;padding:12px}
.head{background:var(--dark);color:#f9f6e8;padding:18px 25px;border-radius:12px}
.head .kicker{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:#d7e0cc}
h1{font:italic 700 clamp(28px,3.6vw,43px)/1.14 Georgia,serif;margin:5px 0 1px}
.subtitle{margin:13px 5px 14px;color:#607864;font-size:14px}
.upper{display:grid;grid-template-columns:1fr 1.08fr;gap:15px}
.imagebox{min-height:290px;max-height:380px;background:#e0e6d8;border:8px solid #e0e6d8;border-radius:13px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.imagebox img{display:none;width:100%;height:100%;object-fit:cover;aspect-ratio:1.5}
.placeholder{font-size:85px}
.ingredients{background:#f0f0e5;border:1px solid var(--line);border-radius:15px;padding:16px}
.ingredients h2{font:italic 700 21px/1.1 Georgia,serif;color:#fff;background:var(--dark);padding:10px 13px;border-radius:7px;margin:0 0 11px}
.ingredients-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ingredient-group{padding:0 9px 0 0}
.ingredient-group+.ingredient-group{border-left:1px solid var(--line);padding-left:16px}
.ingredient-group h3{font:750 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.045em;color:var(--dark);margin:0 0 7px}
ul{margin:0;padding-left:21px}
li{padding:0 0 5px}
li::marker{color:var(--sage);font-weight:800}
.prep-title{display:flex;align-items:center;gap:13px;margin:13px 7px}
.prep-title h2{font:italic 700 30px Georgia,serif;color:var(--dark);margin:0;white-space:nowrap}
.prep-title:after{content:"";height:2px;background:var(--sage);width:100%}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.step-card{background:var(--pale);border:1px solid var(--line);border-radius:14px;padding:15px 18px;break-inside:avoid}
.step-card h3{margin:0 0 12px;font-size:17px;line-height:1.25;color:var(--dark)}
.step-card ol{padding-left:22px;margin:0}
.step-card li{padding-left:3px;padding-bottom:9px}
.step-card p{white-space:pre-wrap;margin:0}
.notice{background:#f0e5c9;border:1px solid #ddc99a;border-radius:9px;padding:9px 14px;margin-top:14px;font-size:12px}
.notice strong{color:var(--dark)}
.error{padding:24px;color:#7c3434}
@media(max-width:720px){
 body{background:var(--paper)}
 .toolbar{padding:11px 15px;gap:10px}
 .toolbar .hint{display:none}
 .toolbar button{width:100%}
 .recipe{padding:8px;margin:0;border:0;box-shadow:none}
 .frame{padding:8px;border-radius:13px}
 .head{padding:20px 17px}
 .head .kicker{font-size:11px}
 h1{font-size:32px}
 .subtitle{font-size:13px;margin:12px 6px}
 .upper,.ingredients-grid,.steps{grid-template-columns:1fr}
 .imagebox{min-height:180px;max-height:none;aspect-ratio:1.48;border-width:5px}
 .imagebox img{aspect-ratio:auto;object-fit:cover}
 .ingredients{padding:13px}
 .ingredients h2{font-size:22px}
 .ingredient-group+.ingredient-group{border-left:0;border-top:1px solid var(--line);padding:10px 0 0}
 .ingredient-group{padding:0}
 .ingredient-group h3{font-size:13px;margin:2px 0 6px}
 .ingredient-group ul{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
 .ingredient-group li{font-size:13px}
 .prep-title{margin:16px 4px 10px}
 .prep-title h2{font-size:29px}
 .steps{gap:11px}
 .step-card{padding:15px}
 .step-card li{font-size:14px}
 .notice{line-height:1.5}
}
@media(max-width:380px){.ingredient-group ul{grid-template-columns:1fr}h1{font-size:28px}}
@page{size:A4 landscape;margin:7mm}
@media print{
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 html,body{width:auto!important;height:auto;background:white!important;margin:0}
 .toolbar{display:none!important}
 .recipe{margin:0;padding:0;max-width:none;border:0;box-shadow:none}
 .frame{border:1px solid #bdcbb7;padding:7px;border-radius:12px}
 .head{padding:12px 17px;border-radius:10px}
 .head .kicker{font-size:10px}
 h1{font-size:29px}
 .subtitle{margin:8px 4px 9px;font-size:11px}
 .upper{display:grid;grid-template-columns:1fr 1.08fr;gap:12px}
 .imagebox{min-height:0;height:78mm;max-height:78mm;border-width:5px;aspect-ratio:auto}
 .imagebox img{width:100%;height:100%;aspect-ratio:auto}
 .ingredients{padding:10px 12px}
 .ingredients h2{font-size:18px;padding:7px 10px;margin-bottom:7px}
 .ingredients-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .ingredient-group+.ingredient-group{border-left:1px solid var(--line);border-top:0;padding:0 0 0 10px}
 .ingredient-group h3{font-size:11px}
 .ingredient-group ul{display:block}
 .ingredient-group li{font-size:11px;line-height:1.32;padding-bottom:4px}
 .prep-title{margin:9px 5px}
 .prep-title h2{font-size:26px}
 .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .step-card{padding:10px 12px;min-height:0}
 .step-card h3{font-size:14px;margin-bottom:8px}
 .step-card li{font-size:10.5px;line-height:1.35;padding-bottom:6px}
 .step-card p{font-size:10.5px}
 .notice{margin-top:9px;padding:6px 11px;font-size:10px}
}
</style>
</head>
<body>
<div class="toolbar"><a href="./kueche.html">← Zurück zum Kochbuch</a><span class="hint">Karte ansehen oder im A4-Querformat drucken</span><button id="print" type="button">Drucken / als PDF speichern</button></div>
<main class="recipe"><div class="frame" id="content">
 <header class="head"><div class="kicker">Mein Kochbuch / Aus meiner Küche</div><h1 id="title">Rezept</h1></header>
 <p class="subtitle" id="subtitle">Ein Rezept aus meinem Kochbuch</p>
 <div class="upper">
  <div><div class="imagebox"><span class="placeholder" id="placeholder">🍽️</span><img id="photo" alt="Foto vom fertigen Gericht"></div><div id="photoCredit" style="font-size:11px;color:var(--sage);margin:7px 2px 0;min-height:14px"></div></div>
  <div class="ingredients"><h2 id="ingredientsTitle">Zutaten</h2><div class="ingredients-grid" id="ingredients"></div></div>
 </div>
 <div class="prep-title"><h2>Zubereitung</h2></div>
 <div class="steps" id="steps"></div>
 <aside class="notice" id="notice" hidden></aside><div class="sources" id="recipeSources" style="margin:14px 4px;font-size:12px;color:var(--sage)"></div>
</div></main>
<script>
(function(){
"use strict";
const qs=new URLSearchParams(location.search);
const menuKey=qs.get("menu"),recipeKey=qs.get("recipe"),planKey=qs.get("plan");
let db={};try{db=JSON.parse(localStorage.getItem("essenTracker.kitchen.v1")||"{}");}catch(e){}
const el=id=>document.getElementById(id);
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list=items=>"<ul>"+items.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
const recipes=Array.isArray(db.recipes)?db.recipes:[];
const menus=Array.isArray(db.menus)?db.menus:[];
const r=recipes.find(r=>r.id===recipeKey);
const m=menus.find(m=>m.id===menuKey);
const p=planKey&&db.plans?.[planKey];
const ids=r?[r.id]:p?(p.recipeIds||[]):m?(m.recipeIds||[]):[];
const found=ids.map(id=>recipes.find(r=>r.id===id)).filter(Boolean);
const name=r?.name||p?.name||m?.name;
const photoMenu=p?(menus.find(m=>m.id===p.menuId)||menus.find(m=>JSON.stringify([...(m.recipeIds||[])].sort())===JSON.stringify([...ids].sort()))):m;
const photoKey=r?"recipe:"+r.id:photoMenu?"menu:"+photoMenu.id:planKey?"plan:"+planKey:"";
function diaryMenuPhoto(date,dish){
 if(!dish||r)return "";
 try{
  const data=JSON.parse(localStorage.getItem("essenTracker.v01")||"{}");
  const photos=data.mealPhotos||{};
  const sought=String(dish).toLocaleLowerCase("de").replace(/\b(?:und|mit)\b/g,",")
    .split(/[,;+]/g).map(x=>x.trim()).filter(x=>x.length>=4);
  if(!sought.length)return "";
  const grouped=new Map();
  for(const e of (Array.isArray(data.entries)?data.entries:[])){
   if(e?.type!=="food"||!e.mealId||!e.date||date&&date!==e.date)continue;
   if(!photos[e.mealId])continue;
   const id=e.date+":"+e.mealId;
   if(!grouped.has(id))grouped.set(id,{date:e.date,parts:[],photo:photos[e.mealId],time:e.time||""});
   grouped.get(id).parts.push(String(e.value||"").toLocaleLowerCase("de").trim());
  }
  return [...grouped.values()].sort((a,b)=>(b.date+"T"+b.time).localeCompare(a.date+"T"+a.time))
   .find(meal=>sought.every(w=>meal.parts.some(x=>x===w||x.includes(w)||w.includes(x))) &&
     typeof meal.photo==="string"&&/^data:image\/(?:png|jpeg|jpg|webp);base64,/i.test(meal.photo))?.photo||"";
 }catch(e){return "";}
}
function displayRecipePhoto(src,example=false,sourceUrl="",credit=""){
 if(!src)return;
 const photo=el("photo"),info=el("photoCredit");
 photo.src=src;photo.style.display="block";
 el("placeholder").style.display="none";
 info.textContent="";
 if(example){
  info.append(document.createTextNode("Beispielfoto, nicht unbedingt exakt das Rezept · "));
  if(/^https:\/\/www\.pexels\.com\/photo\//.test(sourceUrl)){
   const link=document.createElement("a");link.href=sourceUrl;
   link.target="_blank";link.rel="noopener noreferrer";link.textContent=credit||"Fotoquelle";
   info.append(link);
  }
  photo.onerror=()=>{
   photo.style.display="none";el("placeholder").style.display="";
   info.textContent="Beispielfoto derzeit nicht verfügbar";
  };
 }else{
  photo.onerror=null;
 }
}
if(!name){
 el("content").innerHTML='<p class="error">Dieses Rezept wurde auf diesem Gerät nicht gefunden. Öffne es zuerst aus dem Kochbuch.</p>';
 el("print").disabled=true;return;
}
const photoCard=(r
 ?menus.find(x=>Array.isArray(x.recipeIds)&&x.recipeIds[0]===r.id)?.card
 :(m||photoMenu)?.card)||{};
const sampleUrl=(typeof photoCard.image==="string"&&/^https:\/\/images\.pexels\.com\/photos\/\d+\//.test(photoCard.image))
 ?photoCard.image:"";
let card;
if(r)card=r.card||{};
else if((m?.card?.sections||photoMenu?.card?.sections)?.length)card=(m||photoMenu).card;
else if(found.length){
 const groups=[],sections=[],notes=[];
 for(const recipe of found){
  const rc=recipe.card||{};
  for(const g of rc.ingredients||[])groups.push({title:recipe.shortName||recipe.name,items:g.items||[]});
  const allSteps=(rc.sections||[]).flatMap(section=>Array.isArray(section.steps)?section.steps:section.text?[section.text]:[]);
  sections.push({title:recipe.shortName||recipe.name,steps:allSteps.length?allSteps:["Zubereitung noch nicht hinterlegt."]});
  for(const n of (rc.notes||[]).slice(0,1))notes.push((recipe.shortName||recipe.name)+": "+n);
 }
 card={subtitle:"Ein Menü aus "+found.map(r=>r.shortName||r.name).join(" · "),
  servings:found.map(r=>r.card?.servings).filter(Boolean)[0]||"Nach Bedarf",
  time:"Siehe einzelne Zubereitungen",category:"Kombiniertes Menü",
  ingredients:groups,sections,notes};
}else card=m?.card||{};
document.title=name+" · Rezeptkarte";
el("title").textContent=name;
el("subtitle").textContent=card.subtitle||"Mein Lieblingsrezept";
el("ingredientsTitle").textContent="Zutaten"+(card.servings?" · "+card.servings:"");
let groups=Array.isArray(card.ingredients)?card.ingredients:[];
if(!groups.length){
 const entry=r||m||p||{};
 const parts=(entry.parts||[]).map(id=>(db.blocks||[]).find(b=>b.id===id)?.name).filter(Boolean);
 groups=[{title:"Bestandteile",items:parts.length?parts:["Noch keine Zutaten erfasst"]}];
}
el("ingredients").innerHTML=groups.map(g=>
 '<section class="ingredient-group"><h3>'+esc(g.title||"Zutaten")+'</h3>'+list(g.items||[])+'</section>'
).join("");
let sections=Array.isArray(card.sections)?card.sections:[];
if(!sections.length){
 const paragraphs=String((m||p)?.recipe||"Noch keine Anleitung hinterlegt.").split(/\n\s*\n/).filter(Boolean);
 sections=paragraphs.map((line,i)=>({title:(i+1)+" · "+(line.split("\n").length>1?line.split("\n")[0]:"Zubereitung"),text:line.split("\n").slice(1).join("\n")||line}));
}
el("steps").innerHTML=sections.map(section=>'<section class="step-card"><h3>'+
 esc(section.title||"Zubereitung")+'</h3>'+
 (Array.isArray(section.steps)?"<ol>"+section.steps.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>":"<p>"+esc(section.text||"")+"</p>")+'</section>'
).join("");
if(Array.isArray(card.notes)&&card.notes.length){
 el("notice").hidden=false;
 el("notice").innerHTML="<strong>HINWEIS:</strong> "+card.notes.map(esc).join(" ");
}
el("print").addEventListener("click",()=>window.print());
if(photoKey){
 const diary=diaryMenuPhoto(planKey||"",name);
 if(diary)displayRecipePhoto(diary);
 else if(sampleUrl)displayRecipePhoto(sampleUrl,true,photoCard.imageSourceUrl,photoCard.imageCredit);
 try{
  const q=indexedDB.open("essenTracker.kitchen.images",1);
  q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains("photos"))q.result.createObjectStore("photos");};
  q.onsuccess=()=>{
   const read=q.result.transaction("photos","readonly").objectStore("photos").get(photoKey);
   read.onsuccess=()=>{
    if(read.result)displayRecipePhoto(URL.createObjectURL(read.result));
   };
  };
 }catch(e){}
}
const sourceHolder=el("recipeSources");
const references=[...((m||photoMenu)?.sourceLinks||[])];
if(r?.source)references.push({label:"Rezeptidee / Inspiration",url:r.source});
if(references.length){
 sourceHolder.append(document.createTextNode("Rezeptquellen: "));
 for(const item of references){
  if(!item||!/^https:\/\//.test(item.url||""))continue;
  const a=document.createElement("a");a.href=item.url;a.textContent=item.label||"Quelle";
  a.target="_blank";a.rel="noopener noreferrer";a.style.marginRight="12px";
  sourceHolder.append(a);
 }
}
})();
</script>
</body></html>
